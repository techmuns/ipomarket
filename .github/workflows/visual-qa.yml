name: phase-1-visual-qa

# Lightweight visual QA: build the app, run `vite preview`, screenshot every
# route with Playwright, upload as artifact, commit screenshots + auto-summary
# back to the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install node deps
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start vite preview server (background)
        run: |
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "Preview server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start in 30s"
          echo "--- preview log ---"
          cat /tmp/preview.log || true
          exit 1

      - name: Capture screenshots + auto-summary
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/visual-qa/capture.mjs

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill "$(cat /tmp/preview.pid)" 2>/dev/null || true
          fi

      - name: Upload screenshots as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-visual-qa-${{ github.run_id }}
          path: |
            phase-1-screens/
            phase-1-visual-qa.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit screenshots + summary back to branch
        if: always()
        run: |
          git config user.name "phase-1-visual-qa"
          git config user.email "phase-1-visual-qa@users.noreply.github.com"
          git add phase-1-screens/ phase-1-visual-qa.md || true
          if git diff --cached --quiet; then
            echo "no screenshot changes to commit"
          else
            git commit -m "phase-1: visual QA capture ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:${{ github.ref_name }}
          fi
