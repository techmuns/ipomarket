name: phase-0-probes

# Run Phase 0 source-feasibility probes. NOT an ingestion or deploy workflow.
# - manual: workflow_dispatch with optional `group` and `probe` inputs
# - scheduled: every 8 hours, to observe variance across the day

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Probe group to run (A B C D E F G). Leave blank to run all."
        required: false
        default: ""
      probe:
        description: "Single probe id (e.g. P-04). Overrides 'group' if set."
        required: false
        default: ""
  schedule:
    - cron: "15 3,11,19 * * *"

permissions:
  contents: write

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps for PDF probes
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript python3-tk

      - name: Install node deps
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium (for P-23a/P-23b broker-page probes)
        run: npx playwright install --with-deps chromium

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run probes
        env:
          PROBE_GROUP: ${{ inputs.group }}
          PROBE_ID: ${{ inputs.probe }}
        run: |
          ARGS=""
          if [ -n "$PROBE_ID" ]; then
            ARGS="--probe $PROBE_ID"
          elif [ -n "$PROBE_GROUP" ]; then
            ARGS="--group $PROBE_GROUP"
          fi
          echo "running: npm run probe -- $ARGS"
          npm run probe -- $ARGS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-results-${{ github.run_id }}
          path: |
            phase-0/source-probe-report.md
            phase-0/source-probe-results.json
            phase-0/source-status-summary.json
            phase-0/samples
            phase-0/broker-pages
          if-no-files-found: warn
          retention-days: 30

      - name: Commit artifacts back to branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "phase-0-probes"
          git config user.email "phase-0-probes@users.noreply.github.com"
          git add phase-0/ || true
          if git diff --cached --quiet; then
            echo "no probe artifact changes"
          else
            git commit -m "phase-0: refresh probe artifacts ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:${{ github.ref_name }}
          fi
